
name: shop-insight

services:

  # MYSQL DATABASE
  mysql:
    image: mysql:8.4
    container_name: shop-insight-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # APACHE KAFKA
  kafka:
    image: apache/kafka:4.1.2
    container_name: shop-insight-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # APACHE SPARK MASTER
  spark-master:
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    container_name: shop-insight-spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ./pipeline:/opt/spark-apps

  # APACHE SPARK WORKER
  spark-worker:
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    container_name: shop-insight-spark-worker
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 2G
    ports:
      - "8082:8081"
    volumes:
      - ./pipeline:/opt/spark-apps

  # FASTAPI BACKEND
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: shop-insight-backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPARK_MASTER: spark://spark-master:7077
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./pipeline:/app/pipeline
      - ./ml:/app/ml
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      spark-master:
        condition: service_started

  # STREAMLIT FRONTEND
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: shop-insight-frontend
    restart: unless-stopped
    environment:
      API_URL: "http://backend:8000"
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      - backend

volumes:
  mysql_data:
  kafka_data:
